<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Spend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="expense tracker.css" />
    <style>
      .gate {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .gate .brand-mark {
        color: var(--cyan);
        font-size: 26px;
        text-shadow: 0 0 12px rgba(45, 226, 230, 0.6);
      }
      .gate p {
        color: var(--text-secondary);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="starfield"></canvas>

    <div class="gate">
      <span class="brand-mark">✦</span>
      <p>Memuat Cosmic Spend...</p>
    </div>

    <script src="starfield.js"></script>
    <script type="module">
      import { auth } from "./firebase-config.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      // Cek status login dulu, baru tentuin mau kemana:
      // - Sudah login  -> langsung ke halaman utama aplikasi
      // - Belum login  -> ke halaman login (dari situ ada link "Daftar" buat yang belum punya akun)
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.replace("expense tracker.html");
        } else {
          window.location.replace("login.html");
        }
      });
    </script>
  </body>
</html>
