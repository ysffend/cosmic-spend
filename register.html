<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar — Cosmic Spend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="expense tracker.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#07070f" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <canvas id="starfield"></canvas>

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark">✦</span>
          <span class="brand-name">Cosmic Spend</span>
        </div>
        <p class="auth-subtitle">Buat akun baru, gratis</p>

        <div id="authError" class="auth-error hidden">
          <span id="authErrorText"></span>
        </div>

        <form id="registerForm" class="auth-form">
          <div class="form-row">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="kamu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-row">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                placeholder="Minimal 6 karakter"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Tampilkan password"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label for="confirmPassword">Konfirmasi Password</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Ulangi password"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="btn-primary" id="registerBtn">
            Daftar
          </button>
        </form>

        <div class="auth-divider">atau</div>

        <button type="button" class="btn-google" id="googleLoginBtn">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path
              fill="#EA4335"
              d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.9 6.1C12.3 13 17.6 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.1 7.1-17.6z"
            />
            <path
              fill="#FBBC05"
              d="M10.4 19.3C10 20.8 9.7 22.4 9.7 24s.3 3.2.7 4.7l-7.9 6.1C.9 31.4 0 27.8 0 24s.9-7.4 2.5-10.8l7.9 6.1z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.4 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.4 0-11.7-3.5-13.7-8.5l-7.9 6.1C6.5 42.6 14.6 48 24 48z"
            />
          </svg>
          Daftar dengan Google
        </button>

        <p class="auth-footer">
          Sudah punya akun?
          <a href="login.html" class="auth-link">Masuk</a>
        </p>
      </div>
    </div>

    <script src="starfield.js"></script>
    <script type="module" src="register.js"></script>
    <script src="pwa-register.js"></script>
  </body>
</html>
